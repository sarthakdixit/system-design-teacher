name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile.functions"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      force_full_redeploy:
        description: "Run Bicep what-if + apply (infrastructure changes)"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building tag: ${SHORT_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.functions
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sdt-backend:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sdt-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sdt-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sdt-backend:buildcache,mode=max
          platforms: linux/amd64

  deploy-infrastructure:
    name: Deploy infrastructure (Bicep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: []
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full_redeploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Bicep what-if
        run: |
          az deployment group what-if \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters.json

      - name: Bicep deploy
        run: |
          az deployment group create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters.json \
            --name sdt-deploy-${{ github.run_id }}

  update-container-app:
    name: Update Container App image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-push-image

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/sdt-backend:${{ needs.build-and-push-image.outputs.image-tag }} \
            --output none
          echo "Updated to image tag: ${{ needs.build-and-push-image.outputs.image-tag }}"

      - name: Wait for new revision to be ready
        run: |
          APP_NAME="${{ secrets.AZURE_CONTAINER_APP_NAME }}"
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          for i in {1..30}; do
            STATE=$(az containerapp revision list \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --query "[?properties.active].properties.healthState | [0]" \
              -o tsv)
            echo "Revision health: $STATE (attempt $i/30)"
            if [ "$STATE" = "Healthy" ]; then
              echo "Revision is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Revision did not become healthy within 5 minutes"
          exit 1

      - name: Smoke test
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          echo "Hitting https://$APP_URL/health"
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$APP_URL/health" --max-time 10 || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 10 attempts"
          exit 1
