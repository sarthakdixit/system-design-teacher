name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint + typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: backend
        run: |
          ruff check app/
          ruff format --check app/

      - name: Typecheck with mypy
        working-directory: backend
        run: mypy app/core/ --cache-dir /tmp/.mypy_cache

      - name: Run tests
        working-directory: backend
        env:
          ENVIRONMENT: local
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB_NAME: sdt_test
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: sk-placeholder
          LLM_PROVIDER: stub
          JWT_SECRET: ci-test-secret-not-for-production
          MICROSOFT_CLIENT_ID: ci-client-id
          MICROSOFT_TENANT_ID: common
          CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
        run: pytest -q --maxfail=5

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_AUTH_MODE: mock
          VITE_MICROSOFT_CLIENT_ID: ci-client-id
          VITE_MICROSOFT_TENANT_ID: common
        run: npm run build

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:run

  bicep:
    name: Bicep validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bicep
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version

      - name: Lint main.bicep
        run: bicep lint infra/main.bicep

      - name: Build (compile to ARM JSON)
        run: bicep build infra/main.bicep --outfile /tmp/main.json
