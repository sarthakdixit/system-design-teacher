[project]
name = "system-design-teacher-backend"
version = "0.1.0"
description = "FastAPI backend for the System Design Teacher platform."
# Note: no `readme` key. The repo's README.md lives at the repo root, not under
# backend/. Including it here breaks Docker builds (the build context is just
# backend/, so ../README.md is unreachable). The README is still presented on
# GitHub via the repo root — we just don't reference it from package metadata.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Project Owner" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",

    # Validation & settings
    "pydantic[email]>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",

    # Dependency injection
    "dependency-injector>=4.42.0,<5.0",

    # Async I/O clients
    "motor>=3.6.0,<4.0",        # async MongoDB driver
    "redis[hiredis]>=5.2.0,<6.0",  # async Redis client (`redis.asyncio`)
    "httpx>=0.27.0,<1.0",       # async HTTP for OpenAI etc.

    # Telemetry / logging
    "structlog>=24.4.0,<25.0",

    # JSON / cryptography (for JWT in Batch 2; [crypto] adds JWKS support for Batch 5)
    "pyjwt[crypto]>=2.10.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=6.0.0,<7.0",
    "httpx>=0.27.0,<1.0",  # for FastAPI TestClient
    "ruff>=0.8.0,<1.0",
    "mypy>=1.13.0,<2.0",
    # Type stubs for libraries that need them
    "types-redis>=4.6.0",
]
azure = [
    "azure-identity>=1.19.0,<2.0",          # ManagedIdentityCredential, DefaultAzureCredential
    "azure-keyvault-secrets>=4.9.0,<5.0",   # Key Vault secrets client
    "azure-monitor-opentelemetry>=1.6.0,<2.0",  # App Insights via OpenTelemetry
    "aiohttp>=3.10,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ----------------------------------------------------------------------
# Ruff — linter + formatter
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "ASYNC", # flake8-async (catches blocking calls in async code)
    "S",    # bandit (security)
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI `Depends(...)` in defaults is idiomatic
    "S101",   # asserts allowed in tests
    "N818",   # exception suffix renaming (cosmetic)
    "S110",   # try-except-pass for graceful KV degradation
    "SIM105", # contextlib.suppress rewrite
    "UP042",  # StrEnum recommendation
    "RUF005", # iterable unpacking style
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]  # asserts + hardcoded test secrets
"app/config/container.py" = ["B008"]         # provider() in class body is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------
# Mypy — static type checking
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
disallow_any_generics = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Some 3rd-party libs lack stubs; ignore missing types for them rather than failing.
[[tool.mypy.overrides]]
module = [
    "dependency_injector.*",
    "motor.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-m", "not integration",
    "--no-header",
]
markers = [
    "integration: tests that require docker compose up (Mongo, Redis)",
    "unit: tests that run without external infrastructure",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0  # raise as the project matures